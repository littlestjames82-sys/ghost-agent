[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ghost-agent"
version = "0.9.0"
description = "Hermes-style persistent, governed operator for Ghost Developer Studio. Local-first, stdlib only."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ghost-agent = "ghost_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ghost_agent = ["ecosystem_seed.json"]
