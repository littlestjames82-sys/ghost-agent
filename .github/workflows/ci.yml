name: CI
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test deps
        run: pip install pytest
      # The v9-v11 sanity gate files are excluded here: each test spawns
      # real subprocess probes with real waits (the full suite takes
      # ~46 minutes; these three files are most of it). They run weekly
      # in the Slow Gates workflow instead of on every push.
      - name: Test suite
        run: python -m pytest tests/ -q --ignore=tests/test_sanity_gate_v9.py --ignore=tests/test_sanity_gate_v10.py --ignore=tests/test_sanity_gate_v11.py
